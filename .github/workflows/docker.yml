name: Docker build

# Checks that the Dockerfile still builds. Nothing is published: everyone builds
# their own image (see README).

on:
  push:
    paths: [Dockerfile, .dockerignore, Cargo.lock, web/package-lock.json, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, Cargo.lock, web/package-lock.json, .github/workflows/docker.yml]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
