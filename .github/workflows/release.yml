name: Release

# release-please keeps a release PR open that bumps the version and updates
# CHANGELOG.md from the Conventional Commits merged to main. Merging that PR
# tags v<version>, publishes the GitHub release and attaches the binary.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI; a PAT in
          # RELEASE_PLEASE_TOKEN makes CI run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: make build
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          name="katsanto-$VERSION-linux-x86_64"
          tar -czf "$name.tar.gz" -C target/release katsanto-server --transform "s|^|$name/|"
          gh release upload "$TAG" "$name.tar.gz"
